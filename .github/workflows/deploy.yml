# Hexo 博客自动部署:push 到 main 分支 → 自动构建并发布到 GitHub Pages
# 前置:仓库 Settings → Pages → Source 需选择 "GitHub Actions"
name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署,新的 push 自动取消进行中的旧构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 Node.js(带 npm 缓存)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成静态站点
        run: npx hexo clean && npx hexo generate

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
